# Alembic configuration. The database URL is NOT stored here: migrations read DATABASE_URL from the environment
# (see migrations/env.py) and never print it. Migrations are run by hand, never from application start-up:
#
#     cd backend
#     alembic upgrade head          # DATABASE_URL = the OWNER connection (not the application role)
#     alembic downgrade base        # destroys all ChunkVault metadata in the target schema
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
